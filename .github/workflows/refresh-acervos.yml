name: Atualizar acervo oficial do STJ
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Importar arquivos mensais oficiais
        run: python3 scripts/import_stj.py --output data --months 1
      - name: Verificar dados e consulta
        run: |
          node tests/search.test.cjs
          node tests/worker.test.cjs
          python3 -m unittest discover -s tests -p 'test_import.py'
      - name: Salvar dados atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza recorte de acórdãos oficiais do STJ"
            git push
          fi
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar acervo atualizado
        id: deployment
        uses: actions/deploy-pages@v4
